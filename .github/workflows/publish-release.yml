name: Publish CryptoPulse Android Release

on:
  push:
    branches: [ main ]
    paths:
      - "app/build.gradle.kts"
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write

concurrency:
  group: publish-cryptopulse-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish CryptoPulse
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Run lint, tests and assemble APKs
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Package APK, checksum and publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -m 1 'versionName' app/build.gradle.kts | cut -d '"' -f 2)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo "Cannot determine application version" >&2
            exit 1
          fi
          APK_NAME="cryptopulse-$VERSION_NAME-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          RELEASE_TAG="v$VERSION_NAME"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; not replacing the published binary."
            exit 0
          fi
          NOTES_FILE="$RUNNER_TEMP/cryptopulse-release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## CryptoPulse $VERSION_NAME

          Stable Android release of CryptoPulse Market Intelligence.

          ### Included
          - Binance Spot and Kraken market overview with explicit quote-currency labels
          - Market heatmap, asset search, gainers and losers filters
          - Transparent scanner for momentum, reported volume, range and relative hourly volume
          - DEX Radar using public DEX Screener token profiles and pair liquidity/volume
          - Revolut X public recent trades and BTC/USD order book
          - Asset detail and 48 hourly Binance closes
          - Local watchlist and one-shot price alerts with Android notifications

          ### Data and feature limits
          - No user account, personal API key, paid API or app-owned backend is required.
          - USD and USDT quotes are not merged into a synthetic price.
          - Kraken percentage is change since UTC day open; quote-volume notional is estimated.
          - DEX Radar is a limited recent-profile sample, not a full index of every token or pool.
          - Price alerts are evaluated while the app is open; background monitoring is not included.
          - This APK is debug-signed for direct installation, not Play Store production-signed.
          EOF
          gh release create "$RELEASE_TAG" "$APK_NAME#CryptoPulse $VERSION_NAME (debug-signed APK)" "$APK_NAME.sha256#SHA-256 checksum" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CryptoPulse $VERSION_NAME" --notes-file "$NOTES_FILE" --latest
