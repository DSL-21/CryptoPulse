name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      # The hosted Ubuntu image already contains Android command-line tools.
      - name: Install Android SDK components
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPulse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # On successful builds from main, maintain the public v0.1.0 preview release.
      - name: Publish CryptoPulse v0.1.0 preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: \${{ github.sha }}
          name: CryptoPulse v0.1.0 – Initial preview
          body: |
            ## CryptoPulse v0.1.0 – Initial preview

            First installable Android preview of CryptoPulse.

            ### Included
            - Binance Spot public market snapshots
            - Kraken public ticker data for selected USD markets
            - Revolut X public recent trades and BTC/USD order book
            - Transparent rule-based market scanner
            - Local watchlist
            - 48-hour hourly price history for supported Binance pairs

            This is an early development preview. Market coverage and scanner rules will expand in later releases. No exchange login or user API key is required for the public data feeds included in this build.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
